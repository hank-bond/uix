# Vale enforces vocabulary and prose decisions on the docs: each rule is one
# decision, and all rules block. Decisions, archived plans, and design threads
# stay out of scope because they preserve historical wording or name rejected
# terms. Everything else is linted.

StylesPath = .vale/styles
MinAlertLevel = error

[AGENTS.md]
BasedOnStyles = uix

[docs/**]
BasedOnStyles = uix

# Carve-outs: write-once records and append-only logs keep their own voice.
[docs/style-guide.md]
uix.word-choice = NO

[docs/decisions/**]
BasedOnStyles =

[plans/archive/**]
BasedOnStyles =

[docs/design/**]
BasedOnStyles =

[src/docs/**]
BasedOnStyles = uix
