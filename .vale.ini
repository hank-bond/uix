# Vale enforces vocabulary and prose decisions on the docs: each rule is one
# decision, and all rules block. docs/decisions, docs/plans, and docs/design
# stay out of scope: decisions and plans name the terms they reject, and
# design logs are append-only records we do not rewrite. Everything else is
# linted.

StylesPath = .vale/styles
MinAlertLevel = error

[AGENTS.md]
BasedOnStyles = uix

[docs/**]
BasedOnStyles = uix

# Carve-outs: write-once records and append-only logs keep their own voice.
[docs/decisions/**]
BasedOnStyles =

[docs/plans/**]
BasedOnStyles =

[docs/design/**]
BasedOnStyles =

[src/docs/**]
BasedOnStyles = uix
