# Vale enforces vocabulary and prose decisions on the docs: each rule is one
# decision, and all rules block. Grammar rules (grammar) cover stable
# punctuation and sentence shape. Lexicon rules (lexicon) encode the
# controlled vocabulary, which changes as terms retire. Everything else is
# linted.
#
# Decisions and plans are write-once records: the lexicon is excluded there
# because it changes, and the records are locked in. They keep the grammar
# rules, which stay stable. Design threads stay out of scope because they
# preserve historical wording or name rejected terms.

StylesPath = .vale/styles
MinAlertLevel = error

# Source-code comments obey the same prose rules as docs. Code files run only
# the comment-text rules (comments), not the markdown prose rules.
[*.{ts,tsx,mts,cts,mjs,cjs,js}]
BasedOnStyles = comments

# Non-source trees: the local workspace scaffold, pi harness tooling, and
# build output stay out of the lint pool, matching the ESLint ignore set.
[.uix/**]
BasedOnStyles =

[.pi/**]
BasedOnStyles =

[out/**]
BasedOnStyles =

[dist/**]
BasedOnStyles =

[**/AGENTS.md]
BasedOnStyles = grammar, lexicon

[docs/**]
BasedOnStyles = grammar, lexicon

# Write-once records: decisions and plans keep grammar only. The lexicon is
# excluded because it changes and the records are locked in.
[docs/decisions/**]
BasedOnStyles = grammar

[plans/**]
BasedOnStyles = grammar

# Design threads preserve historical wording and name rejected terms, so they
# stay out of the lint pool entirely.
[docs/design/**]
BasedOnStyles =

# Carve-outs: the prose guide quotes banned forms, while write-once records
# and append-only logs keep their own voice.
[docs/contributing/prose-style.md]
lexicon.word-choice = NO

[src/docs/**]
BasedOnStyles = grammar, lexicon

# The lexicon quotes the retired words it defines, so the retired-word rules
# are off there. Everything else still runs.
[docs/architecture/conventions/lexicon/**]
lexicon.retired-verbs = NO

lexicon.retired-registration = NO

lexicon.runtime-phrase = NO
