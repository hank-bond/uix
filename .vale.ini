# Vale enforces vocabulary and prose decisions on the docs: each rule is one
# decision, and all rules block. Decisions, archived plans, and design threads
# stay out of scope because they preserve historical wording or name rejected
# terms. Everything else is linted.

StylesPath = .vale/styles
MinAlertLevel = error

# Source-code comments obey the same prose rules as docs. Code files run only
# the comment-text rules (uix-src), not the markdown prose rules.
[*.{ts,tsx,mts,cts,mjs,cjs,js}]
BasedOnStyles = uix-src

# Non-source trees: the local workspace scaffold, pi harness tooling, and
# build output stay out of the lint pool, matching the ESLint ignore set.
[.uix/**]
BasedOnStyles =

[.pi/**]
BasedOnStyles =

[out/**]
BasedOnStyles =

[dist/**]
BasedOnStyles =

[**/AGENTS.md]
BasedOnStyles = uix

[docs/**]
BasedOnStyles = uix

# Carve-outs: write-once records and append-only logs keep their own voice.
[docs/contributing/doc-style-guide.md]
uix.word-choice = NO

[docs/decisions/**]
BasedOnStyles =

[plans/archive/**]
BasedOnStyles =

[docs/design/**]
BasedOnStyles =

[src/docs/**]
BasedOnStyles = uix
